[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workspace-kit"
version = "0.1.0"
description = "GitHub-backed refined memory and read-only local artifact retrieval for AI clients"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==2.2.0"]

[project.scripts]
ai-workspace = "workspace.kit:main"
ai-workspace-mcp = "workspace.bridge:main"
ai-workspace-artifacts = "workspace.artifact_cli:main"

[tool.setuptools]
packages = ["workspace"]
