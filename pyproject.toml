[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workspace-kit"
version = "0.3.0"
description = "GitHub-backed refined memory and recoverable local filesystem MCP tools for AI clients"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==2.2.0", "chatgpt-local-files @ git+https://github.com/alice840126-ship-it/chatgpt-local-files.git@cb93501a4771fd2e2dc10b42a6f9327f16db3599"]

[project.scripts]
ai-workspace = "workspace.kit:main"
ai-workspace-mcp = "workspace.bridge:main"
ai-workspace-artifacts = "workspace.artifact_cli:main"
ai-workspace-files-check = "workspace.files_check:main"

[tool.setuptools]
packages = ["workspace"]
